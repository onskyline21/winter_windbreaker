<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동계 트레이닝탑 최종 후보</title>
<style>
  :root{
    --nav-h: 56px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    padding:0;
    background:#f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
    color:#222;
  }

  /* 상단 고정 책갈피 네비게이션 */
  nav{
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1c1c1e;
    height: var(--nav-h);
    display:flex;
    align-items:center;
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  nav::-webkit-scrollbar{ display:none; }
  nav a{
    display:inline-block;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    padding: 0 12px;
    line-height: var(--nav-h);
    border-right: 1px solid #3a3a3c;
    flex-shrink:0;
  }
  nav a:active, nav a:hover{
    background:#3a3a3c;
  }
  nav a.disabled{
    color:#777;
    pointer-events:none;
    cursor:not-allowed;
    text-decoration: line-through;
    background:#262626;
  }

  h1{
    text-align:center;
    font-size:18px;
    margin: 16px 0 8px 0;
  }

  /* 2열 x 8행 고정 그리드 */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    max-width: 900px;
    margin: 0 auto;
  }
  .item{
    position:relative;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    scroll-margin-top: calc(var(--nav-h) + 8px); /* 앵커 이동 시 네비에 가리지 않도록 */
  }
  .item.rejected img{
    cursor:not-allowed;
  }
  .item .reject-overlay{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 52px;
    font-weight:800;
    letter-spacing: 4px;
    z-index: 5;
    pointer-events: all; /* 클릭을 가로채 아래 이미지 클릭을 막음 */
  }
  .item img{
    display:block;
    width:100%;
    height:auto;
    cursor: zoom-in;
  }
  .item .label{
    text-align:center;
    font-size:13px;
    font-weight:600;
    padding:6px 4px;
    color:#444;
    border-top:1px solid #eee;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:#999;
    padding: 20px 0 32px;
  }

  /* 이미지 원본 미리보기 (같은 페이지 내 오버레이, 브라우저 팝업 아님) */
  #preview{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    flex-direction: column;
  }
  #preview.open{
    display:flex;
  }
  .preview-title{
    flex-shrink:0;
    text-align:center;
    color:#fff;
    font-size:15px;
    font-weight:700;
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(0,0,0,0.92);
  }
  .preview-scroll{
    flex:1;
    overflow:auto;
    -webkit-overflow-scrolling: touch;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: 16px;
  }
  .preview-scroll img{
    /* 원본 크기 그대로 표시 (확대/축소 없음) */
    width:auto;
    height:auto;
    max-width:none;
    display:block;
    margin:auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border-radius:4px;
  }
  .preview-closebar{
    flex-shrink:0;
    display:flex;
    justify-content:center;
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.92);
  }
  .preview-closebar button{
    background:#fff;
    color:#1c1c1e;
    border:none;
    border-radius: 24px;
    font-size:15px;
    font-weight:700;
    padding: 10px 32px;
    cursor:pointer;
  }
  .preview-closebar button:active{
    background:#ddd;
  }
</style>
</head>
<body>

<nav id="top">
  <a href="#item03">03번 FA7685</a>
  <a href="#item04">04번 HX9703</a>
</nav>

<h1>동계 트레이닝탑 최종 후보</h1>

<div class="grid">
  <div class="item" id="item03">
    <img src="images/03_FA7685.png" alt="03번 FA7685" loading="lazy">
    <div class="label">03번 FA7685</div>
  </div>
  <div class="item" id="item04">
    <img src="images/04_HX9703.png" alt="04번 HX9703" loading="lazy">
    <div class="label">04번 HX9703</div>
  </div>
</div>

<footer>
  총 2개 상품 · 상단 번호를 누르면 해당 항목으로 이동합니다
</footer>

<!-- 원본 이미지 미리보기 오버레이 -->
<div id="preview">
  <div class="preview-title" id="previewTitle"></div>
  <div class="preview-scroll" id="previewScroll">
    <img id="previewImg" src="" alt="원본 미리보기">
  </div>
  <div class="preview-closebar">
    <button type="button" onclick="closePreview()">닫기</button>
  </div>
</div>

<script>
  function openPreview(src, alt){
    var preview = document.getElementById('preview');
    var img = document.getElementById('previewImg');
    img.src = src;
    img.alt = alt;
    document.getElementById('previewTitle').textContent = alt;
    preview.classList.add('open');
    document.getElementById('previewScroll').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closePreview(){
    var preview = document.getElementById('preview');
    preview.classList.remove('open');
    document.getElementById('previewImg').src = '';
    document.body.style.overflow = '';
  }
  // 그리드의 썸네일 이미지를 모두 클릭 가능하게 연결 (탈락 항목은 제외)
  document.querySelectorAll('.item:not(.rejected) img').forEach(function(img){
    img.addEventListener('click', function(){
      openPreview(img.getAttribute('src'), img.getAttribute('alt'));
    });
  });
  // 어두운 배경(이미지 바깥) 클릭 시에도 닫기
  document.getElementById('previewScroll').addEventListener('click', function(e){
    if(e.target.id === 'previewScroll'){
      closePreview();
    }
  });
</script>

</body>
</html>
